<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veil</title>
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div class="wordmark"><span class="wordmark__mark" aria-hidden="true"></span><span>veil</span></div>
        <label class="switch" title="Scan images automatically">
          <input id="enabled" type="checkbox" aria-label="Scan images automatically" />
          <span></span>
        </label>
      </header>

      <section class="scan-card" aria-live="polite">
        <p class="eyebrow" id="scan-state">Waiting</p>
        <h1 id="summary">Open a regular webpage to start.</h1>
        <p id="site-name" class="muted">Every check stays on this device.</p>
        <p class="scan-card__count"><span id="scanned-count">0</span> checked</p>
      </section>

      <section class="tally" aria-label="Page results">
        <div><strong id="ai-count">0</strong><span>Likely AI</span></div>
        <div><strong id="real-count">0</strong><span>Likely real</span></div>
        <div><strong id="error-count">0</strong><span>Unreadable</span></div>
      </section>

      <label class="treatment-control">
        <span><strong>Likely-AI images</strong><small>Applies on this page immediately.</small></span>
        <select id="ai-image-action">
          <option value="blur">Blur</option>
          <option value="hide">Hide</option>
          <option value="label">Label only</option>
        </select>
      </label>

      <section class="results-section">
        <div class="section-heading"><h2>Recent</h2><span id="threshold-label">65% line</span></div>
        <div id="empty-state" class="empty-state">
          <p>Visible images will show up here as they are checked.</p>
        </div>
        <ol id="results" class="result-list" hidden></ol>
      </section>

      <footer class="popup-footer">
        <button id="rescan" class="button" type="button">Scan this page again</button>
        <button id="settings" class="button button--quiet" type="button">Settings</button>
      </footer>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
